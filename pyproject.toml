[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-intan"
version = "0.2.1"
description = "Python interfaces and utilities for Intan RHX devices and electrophysiology data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jonathan Shulgach", email = "jshulgac@andrew.cmu.edu" },
]
keywords = ["intan", "emg", "electrophysiology", "neurotechnology", "signal-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "pylsl>=1.16",
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
]
ml = [
    "joblib>=1.3",
    "torch>=2.0",
]
video = [
    "mediapipe>=0.10",
    "opencv-python>=4.5",
]
docs = [
    "m2r2>=0.3",
    "sphinx>=7",
    "sphinx-autodoc-typehints>=1.24",
    "sphinx-copybutton>=0.5",
]
test = [
    "build>=1.2",
    "pytest>=8",
    "twine>=5",
]
[project.scripts]
intan-emg-viewer = "intan._cli:emg_viewer_main"
intan-trial-selector = "intan._cli:trial_selector_main"

[project.urls]
Documentation = "https://neuro-mechatronics-interfaces.github.io/python-intan/"
Homepage = "https://github.com/Neuro-Mechatronics-Interfaces/python-intan"
Issues = "https://github.com/Neuro-Mechatronics-Interfaces/python-intan/issues"
Repository = "https://github.com/Neuro-Mechatronics-Interfaces/python-intan.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["intan*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
